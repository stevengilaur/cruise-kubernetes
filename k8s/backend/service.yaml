# Service — Backend API (accès interne uniquement)

apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
  namespace: prod
  labels:
    app: backend
    tier: backend
    env: prod
    project: cruise
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
