apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: registry-pull-secret
      containers:
      - name: frontend
        image: 192.168.56.25:30500/frontend:v2
        ports:
        - containerPort: 8080