# Deployment — Frontend Node.js/Express

apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: prod
  labels:
    app: frontend
    tier: frontend
    env: prod
    project: cruise
  annotations:
    description: "Deployment frontend Node.js servant l'interface Todo List"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
        env: prod
        project: cruise
    spec:
      imagePullSecrets:
        - name: regcred

      containers:
        - name: frontend
          image: 192.168.56.10:5000/todo-frontend:v2
          ports:
            - containerPort: 3000
              protocol: TCP

          env:
            - name: PORT
              value: "3000"
            - name: BACKEND_URL
              value: "http://todo-backend-svc:3001"

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
