# Service — Frontend (accès externe via NodePort)

apiVersion: v1
kind: Service
metadata:
  name: todo-frontend-svc
  namespace: prod
  labels:
    app: frontend
    tier: frontend
    env: prod
    project: cruise
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
