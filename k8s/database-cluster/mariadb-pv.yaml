apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb-pv-0
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-db
  hostPath:
    path: /data/mariadb-0
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb-pv-1
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-db
  hostPath:
    path: /data/mariadb-1
