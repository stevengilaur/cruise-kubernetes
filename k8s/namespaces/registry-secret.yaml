# Secret pour accéder à la registry privée
# À appliquer dans chaque namespace qui a besoin de puller des images

# NOTE : Ce fichier est un template.
# La vraie commande pour créer le secret est :
# kubectl create secret docker-registry regcred \
#   --docker-server=192.168.56.10:5000 \
#   --docker-username=admin \
#   --docker-password=adminpassword \
#   --namespace=prod

# Ce secret sera référencé dans chaque pod via :
# imagePullSecrets:
#   - name: regcred
