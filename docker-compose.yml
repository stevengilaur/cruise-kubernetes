# docker-compose.yml — Test local UNIQUEMENT
# En production, les images seront déployées sur Kubernetes

services:

  database:
    build: ./database
    container_name: todo-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: todouser
      DB_PASSWORD: todopassword
      DB_NAME: tododb
      PORT: 3001
    depends_on:
      database:
        condition: service_healthy
    networks:
      - todo-network

  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  db-data:
